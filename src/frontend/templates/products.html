<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoodStock</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% include '_nav.html' %}
<div class="container">
<h1>Shop</h1>
<form method="GET" action="/" class="filters">
<input type="text" name="q" placeholder="Search products..." value="{{ search_query or '' }}">
<select name="category">
<option value="">All categories</option>
{% for cat in categories %}
<option value="{{ cat.category_id }}" {% if selected_category == cat.category_id|string %}selected{% endif %}>{{ cat.category_name }}</option>
{% endfor %}
</select>
<select name="sort">
<option value="">Sort by</option>
<option value="price_asc" {% if selected_sort == 'price_asc' %}selected{% endif %}>Price: low to high</option>
<option value="price_desc" {% if selected_sort == 'price_desc' %}selected{% endif %}>Price: high to low</option>
<option value="name_asc" {% if selected_sort == 'name_asc' %}selected{% endif %}>Name: A-Z</option>
</select>
<button type="submit" class="btn">Apply</button>
</form>
<div class="table-wrap">
<table class="data">
<tr>
<th>Product</th>
<th>Category</th>
<th>Price</th>
<th>In stock</th>
<th></th>
</tr>
{% for p in products %}
<tr>
<td>{{ p.product_name }}</td>
<td>{{ p.category_name }}</td>
<td class="price">₹{{ p.price }}</td>
<td>{{ p.quantity }}</td>
<td>
<form method="POST" action="/add_to_cart/{{ p.product_id }}">
<button type="submit" class="btn">Add to cart</button>
</form>
</td>
</tr>
{% endfor %}
</table>
</div>
</div>
</body>
</html>
