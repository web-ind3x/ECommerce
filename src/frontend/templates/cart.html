<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart — GoodStock</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% include '_nav.html' %}
<div class="container">
<h1>Your cart</h1>
{% if error %}
<p class="error-text">{{ error }}</p>
{% endif %}
<div class="table-wrap">
<table class="data">
<tr>
<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Subtotal</th>
<th></th>
</tr>
{% for item in cart_items %}
<tr>
<td>{{ item.product_name }}</td>
<td class="price">₹{{ item.price }}</td>
<td>{{ item.quantity }}</td>
<td class="price">₹{{ item.subtotal }}</td>
<td>
<form method="POST" action="/remove_from_cart/{{ item.cart_item_id }}">
<button type="submit" class="btn-danger">Remove</button>
</form>
</td>
</tr>
{% endfor %}
</table>
</div>
<p class="total-line">Total: ₹{{ total }}</p>
{% if cart_items %}
<form method="POST" action="/checkout">
<button type="submit" class="btn">Checkout</button>
</form>
{% endif %}
</div>
</body>
</html>
